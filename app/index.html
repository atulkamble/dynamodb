<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DynamoDB Practice Lab</title><style>:root{font-family:Inter,system-ui,Arial;background:#0b1220;color:#e8eef8}*{box-sizing:border-box}body{margin:0}header{background:#111d32;padding:22px 30px;border-bottom:1px solid #263650}h1{margin:0;font-size:25px}header p{color:#a9bad2;margin:8px 0 0}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 90px)}nav{background:#111a2c;padding:20px;display:flex;flex-direction:column;gap:9px}button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;font-weight:650;background:#263751;color:#e9f1ff}button:hover{background:#375075}nav button{text-align:left}.active,.primary{background:#ff9d27;color:#1b2330}main{padding:28px;max-width:1150px;width:100%;margin:auto}.panel{background:#142139;border:1px solid #2a3c58;border-radius:14px;padding:22px;margin-bottom:20px}h2{margin:0 0 16px;font-size:22px}h3{margin:12px 0}.muted{color:#a9bad2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.stat{background:#1b2b46;padding:18px;border-radius:12px}.stat strong{display:block;font-size:24px;color:#ffb65c;margin-top:8px}input,select{width:100%;background:#0c1729;color:#fff;border:1px solid #40516c;border-radius:8px;padding:11px;margin:5px 0 12px}label{font-size:13px;color:#b7c8dd}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #30415d}th{color:#ffb65c}pre{background:#091321;border:1px solid #30415d;border-radius:10px;padding:17px;overflow:auto;white-space:pre-wrap;line-height:1.55;color:#a7e9c0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.danger{background:#763543}.good{color:#75d9a1}.warn{color:#ffc071}.hidden{display:none}.scroll{overflow:auto}.notice{padding:12px;background:#203654;border-radius:9px;margin:12px 0}@media(max-width:720px){.layout{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}main{padding:14px}}</style></head><body><header><h1>⚡ AWS DynamoDB Practice Lab</h1><p>Employee Management • CRUD • Query & Scan • GSI • CLI • Demo Mode (local only)</p></header><div class="layout"><nav id="nav"></nav><main id="main"></main></div><script>
const initial=[{EmployeeID:'E101',Name:'Atul',Department:'IT',Salary:80000},{EmployeeID:'E102',Name:'Ravi',Department:'DevOps',Salary:65000}];let employees=JSON.parse(localStorage.getItem('dynamoEmployees')||'null')||initial;let music=JSON.parse(localStorage.getItem('dynamoMusic')||'null')||[{Artist:'Acme Band',SongTitle:'Happy Day',AlbumTitle:'Songs About Life',Awards:10}];let tableExists=localStorage.getItem('dynamoTable')!=='false';let view='Dashboard';let log=[];const tabs=['Dashboard','Employees CRUD','Query vs Scan','Indexes & Keys','Music Table','AWS CLI','Concepts'];const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem('dynamoEmployees',JSON.stringify(employees));localStorage.setItem('dynamoMusic',JSON.stringify(music));localStorage.setItem('dynamoTable',String(tableExists))};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const code=s=>`<pre>${safe(s)}</pre>`;const cmd=(s)=>{log.unshift(s);return code(s)};function show(v){view=v;render()}function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${view===t?'active':''}" onclick="show('${t}')">${t}</button>`).join('');const fn={'Dashboard':dashboard,'Employees CRUD':crud,'Query vs Scan':query,'Indexes & Keys':indexes,'Music Table':musicView,'AWS CLI':cli,'Concepts':concepts};$('main').innerHTML=fn[view]()}function dashboard(){return `<h2>Overview</h2><div class="grid"><div class="stat">Employees table<strong>${tableExists?'ACTIVE':'DELETED'}</strong></div><div class="stat">Employee records<strong>${tableExists?employees.length:0}</strong></div><div class="stat">Music records<strong>${music.length}</strong></div><div class="stat">Billing mode<strong>On-Demand</strong></div></div><div class="panel"><h2>Table management</h2><p>Partition key: <b>EmployeeID (String)</b> • Billing: PAY_PER_REQUEST</p><div class="toolbar"><button class="primary" onclick="createTable()">Create Employees Table</button><button class="danger" onclick="deleteTable()">Delete Employees Table</button><button onclick="reset()">Reset Demo</button></div><div class="notice">All data stays in this browser's local storage. No AWS credentials or network connection required.</div></div><div class="panel"><h2>Hands-on workflow</h2><p>Create table → Insert → Get → Update → Query → Scan → Delete item → Delete table.</p>${code('aws dynamodb create-table --table-name Employees --attribute-definitions AttributeName=EmployeeID,AttributeType=S --key-schema AttributeName=EmployeeID,KeyType=HASH --billing-mode PAY_PER_REQUEST')}</div>`}function createTable(){if(tableExists)return alert('Employees table already exists');tableExists=true;employees=[];save();render()}function deleteTable(){if(!tableExists)return alert('Table already deleted');if(confirm('Delete Employees table and all its records?')){tableExists=false;employees=[];save();render()}}function reset(){if(confirm('Reset demo data?')){employees=structuredClone(initial);music=[{Artist:'Acme Band',SongTitle:'Happy Day',AlbumTitle:'Songs About Life',Awards:10}];tableExists=true;save();render()}}function rows(data,fields){return `<div class="scroll"><table><thead><tr>${fields.map(f=>`<th>${f}</th>`).join('')}</tr></thead><tbody>${data.map(x=>`<tr>${fields.map(f=>`<td>${safe(x[f]??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${fields.length}">No records</td></tr>`}</tbody></table></div>`}function crud(){return `<h2>Employees CRUD</h2><div class="panel"><h3>Insert / Update Employee</h3><div class="grid"><div><label>Employee ID</label><input id="id" placeholder="E103"></div><div><label>Name</label><input id="name" placeholder="Name"></div><div><label>Department</label><input id="dept" placeholder="IT"></div><div><label>Salary</label><input id="salary" type="number" min="0" placeholder="70000"></div></div><div class="toolbar"><button class="primary" onclick="put()">PutItem (insert / replace)</button><button onclick="updateSalary()">Update salary only</button><button onclick="get()">GetItem by ID</button><button class="danger" onclick="remove()">DeleteItem by ID</button></div><p id="result" class="muted">Enter employee details to begin.</p></div><div class="panel"><h3>Employees (${employees.length})</h3>${tableExists?rows(employees,['EmployeeID','Name','Department','Salary']):'<p class="warn">Create the Employees table first.</p>'}</div><div class="panel"><h3>Generated AWS CLI</h3><pre id="generated">Commands appear here after an operation.</pre></div>`}function val(id){return $(id).value.trim()}function ensure(){if(!tableExists){alert('Create Employees table first');return false}return true}function output(msg,command){$('result').textContent=msg;$('generated').textContent=command;log.unshift(command)}function put(){if(!ensure())return;let id=val('id'),name=val('name'),dept=val('dept'),salary=Number(val('salary'));if(!id||!name||!dept||val('salary')===''||!Number.isFinite(salary)||salary<0)return alert('Enter valid values for all fields');let item={EmployeeID:id,Name:name,Department:dept,Salary:salary};employees=employees.filter(x=>x.EmployeeID!==id);employees.push(item);save();render();output('Saved '+id+' (PutItem replaces an existing item with the same key).',`aws dynamodb put-item --table-name Employees --item '${JSON.stringify({EmployeeID:{S:id},Name:{S:name},Department:{S:dept},Salary:{N:String(salary)}})}'`)}function get(){if(!ensure())return;let id=val('id');if(!id)return alert('Enter Employee ID');let found=employees.find(x=>x.EmployeeID===id);output(found?JSON.stringify(found):'Item not found',`aws dynamodb get-item --table-name Employees --key '${JSON.stringify({EmployeeID:{S:id}})}'`)}function updateSalary(){if(!ensure())return;let id=val('id'),s=val('salary'),n=Number(s);if(!id||s===''||!Number.isFinite(n)||n<0)return alert('Enter ID and valid salary');let e=employees.find(x=>x.EmployeeID===id);if(!e)return alert('Employee not found; update disabled for missing item');e.Salary=n;save();render();output('Updated salary for '+id,`aws dynamodb update-item --table-name Employees --key '${JSON.stringify({EmployeeID:{S:id}})}' --update-expression 'SET Salary = :s' --expression-attribute-values '${JSON.stringify({':s':{N:String(n)}})}' --condition-expression 'attribute_exists(EmployeeID)'`)}function remove(){if(!ensure())return;let id=val('id');if(!id)return alert('Enter Employee ID');employees=employees.filter(x=>x.EmployeeID!==id);save();render();output('DeleteItem completed for '+id,`aws dynamodb delete-item --table-name Employees --key '${JSON.stringify({EmployeeID:{S:id}})}'`)}function query(){return `<h2>Query vs Scan</h2><div class="panel"><h3>Query by partition key</h3><label>EmployeeID</label><input id="qid" placeholder="E101"><button class="primary" onclick="runQuery()">Run Query</button><div id="qout" class="notice">Query uses the EmployeeID partition key.</div></div><div class="panel"><h3>Scan all items</h3><button onclick="runScan()">Run Scan</button><div id="sout" class="notice">Scan examines the table and is not ideal for frequent large-table lookups.</div></div><div class="panel">${rows([{Operation:'Query',Behavior:'Uses key condition',Use:'Known EmployeeID'},{Operation:'Scan',Behavior:'Reads table items',Use:'Exploration / small datasets'}],['Operation','Behavior','Use'])}</div>`}function runQuery(){if(!ensure())return;let id=val('qid');if(!id)return alert('Enter EmployeeID');let r=employees.filter(x=>x.EmployeeID===id);$('qout').innerHTML=`Found ${r.length} item(s). ${code(`aws dynamodb query --table-name Employees --key-condition-expression 'EmployeeID = :id' --expression-attribute-values '${JSON.stringify({':id':{S:id}})}'`)}${rows(r,['EmployeeID','Name','Department','Salary'])}`}function runScan(){if(!ensure())return;$('sout').innerHTML=`Found ${employees.length} item(s). ${code('aws dynamodb scan --table-name Employees')}${rows(employees,['EmployeeID','Name','Department','Salary'])}`}function indexes(){return `<h2>Keys & Secondary Indexes</h2><div class="panel"><h3>Employees primary key</h3><p><b>EmployeeID</b> is the partition key. It uniquely identifies each employee.</p><h3>GSI example: DepartmentIndex</h3><p>For querying all employees in a department, create a GSI with <b>Department</b> as its partition key. This demo simulates that access pattern; it does not create a real index.</p><label>Department</label><select id="department">${[...new Set(employees.map(x=>x.Department))].map(x=>`<option>${safe(x)}</option>`).join('')}</select><button class="primary" onclick="gsi()">Simulate GSI Query</button><div id="gsiout" class="notice">Select a department to see matching employees.</div></div><div class="panel">${rows([{Feature:'GSI',Key:'Alternative partition key',Creation:'Any time',Consistency:'Eventually consistent only'},{Feature:'LSI',Key:'Same partition key, different sort key',Creation:'At table creation',Consistency:'Strong or eventual'}],['Feature','Key','Creation','Consistency'])}</div>`}function gsi(){let d=val('department');$('gsiout').innerHTML=rows(employees.filter(x=>x.Department===d),['EmployeeID','Name','Department','Salary'])+code(`aws dynamodb query --table-name Employees --index-name DepartmentIndex --key-condition-expression 'Department = :d' --expression-attribute-values '${JSON.stringify({':d':{S:d}})}'`)+`<p class="warn">CLI command requires creating DepartmentIndex in AWS first.</p>`}function musicView(){return `<h2>Music Table — Composite Key</h2><div class="panel"><p>Partition key: <b>Artist</b> • Sort key: <b>SongTitle</b></p><div class="grid"><div><label>Artist</label><input id="artist" placeholder="Acme Band"></div><div><label>Song title</label><input id="song" placeholder="Happy Day"></div><div><label>Album</label><input id="album" placeholder="Album name"></div><div><label>Awards</label><input id="awards" type="number" min="0" placeholder="0"></div></div><div class="toolbar"><button class="primary" onclick="addSong()">PutItem</button><button onclick="querySongs()">Query Artist</button><button class="danger" onclick="deleteSong()">Delete Item</button></div><div id="musicResult" class="notice">Both Artist and SongTitle identify a unique song.</div></div><div class="panel">${rows(music,['Artist','SongTitle','AlbumTitle','Awards'])}</div>`}function addSong(){let Artist=val('artist'),SongTitle=val('song'),AlbumTitle=val('album'),a=val('awards'),Awards=Number(a);if(!Artist||!SongTitle||!AlbumTitle||a===''||!Number.isFinite(Awards)||Awards<0)return alert('Complete all fields');music=music.filter(x=>!(x.Artist===Artist&&x.SongTitle===SongTitle));music.push({Artist,SongTitle,AlbumTitle,Awards});save();render()}function querySongs(){let artist=val('artist');$('musicResult').innerHTML=rows(music.filter(x=>x.Artist===artist),['Artist','SongTitle','AlbumTitle','Awards'])}function deleteSong(){let artist=val('artist'),song=val('song');if(!artist||!song)return alert('Enter both keys');music=music.filter(x=>!(x.Artist===artist&&x.SongTitle===song));save();render()}const commands=[['Create Employees table',`aws dynamodb create-table \\\n  --table-name Employees \\\n  --attribute-definitions AttributeName=EmployeeID,AttributeType=S \\\n  --key-schema AttributeName=EmployeeID,KeyType=HASH \\\n  --billing-mode PAY_PER_REQUEST`],['List tables','aws dynamodb list-tables'],['Describe table','aws dynamodb describe-table --table-name Employees'],['Scan','aws dynamodb scan --table-name Employees'],['Get item',`aws dynamodb get-item --table-name Employees --key '{"EmployeeID":{"S":"E101"}}'`],['Query',`aws dynamodb query --table-name Employees --key-condition-expression 'EmployeeID = :id' --expression-attribute-values '{":id":{"S":"E101"}}'`],['Delete table','aws dynamodb delete-table --table-name Employees'],['Create Music table',`aws dynamodb create-table \\\n --table-name Music \\\n --attribute-definitions AttributeName=Artist,AttributeType=S AttributeName=SongTitle,AttributeType=S \\\n --key-schema AttributeName=Artist,KeyType=HASH AttributeName=SongTitle,KeyType=RANGE \\\n --billing-mode PAY_PER_REQUEST`]];function cli(){return `<h2>AWS CLI Reference</h2><p class="muted">Commands are shown for learning. Copy them into a configured AWS CLI terminal to use actual DynamoDB.</p>${commands.map(([name,c])=>`<div class="panel"><h3>${name}</h3>${code(c)}<button onclick="navigator.clipboard.writeText(${JSON.stringify(c)})">Copy command</button></div>`).join('')}`}function concepts(){return `<h2>Concepts & Quick Revision</h2><div class="panel"><h3>What is DynamoDB?</h3><p>Fully managed, serverless NoSQL key-value and document database. Data is stored in tables, items, and attributes.</p>${rows([{Term:'Partition key',Meaning:'Required HASH key for data distribution'},{Term:'Sort key',Meaning:'Optional RANGE key ordering items sharing a partition key'},{Term:'GSI',Meaning:'Secondary index with alternative partition key'},{Term:'LSI',Meaning:'Index with same partition key and different sort key'},{Term:'RCU / WCU',Meaning:'Read / Write capacity units'},{Term:'TTL',Meaning:'Asynchronous expiration of items'},{Term:'Streams',Meaning:'Capture changes to table items'},{Term:'PITR',Meaning:'Point-in-time recovery'}],['Term','Meaning'])}</div><div class="panel"><h3>DynamoDB vs RDS</h3>${rows([{Aspect:'Model',DynamoDB:'NoSQL',RDS:'Relational'},{Aspect:'Schema',DynamoDB:'Flexible non-key attributes',RDS:'Defined tables'},{Aspect:'Queries',DynamoDB:'API / PartiQL',RDS:'SQL and joins'},{Aspect:'Scaling',DynamoDB:'Managed partition scaling',RDS:'Instance / storage scaling'}],['Aspect','DynamoDB','RDS'])}</div><div class="panel"><h3>Points to remember</h3><p>400 KB maximum item size • PutItem replaces an item with the same key • GetItem requires full primary key • Query generally preferred over Scan for key lookups • On-demand billing suits variable workloads • GSI reads are eventually consistent • TTL deletion is asynchronous • Global Tables replicate across Regions • IAM controls access • CloudWatch monitors metrics.</p></div>`}render();
</script></body></html>
