<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS DynamoDB Employee Manager</title><style>body{font:16px system-ui;background:#0b1220;color:#edf3ff;margin:0}header,main{padding:22px;max-width:1050px;margin:auto}header{border-bottom:1px solid #35465f}h1{margin-bottom:5px}p{color:#afc0d8}.panel{background:#17243b;padding:22px;border-radius:14px;margin:18px 0}input{padding:12px;border-radius:7px;border:1px solid #62708a;background:#0d182b;color:white;min-width:155px;margin:6px}button{padding:12px;border:0;border-radius:7px;background:#f6a63c;color:#151b27;font-weight:700;cursor:pointer;margin:5px}.danger{background:#ed8a90}.secondary{background:#b4c9e6}.fields{display:flex;flex-wrap:wrap}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #42516b;text-align:left}#message{white-space:pre-wrap;color:#a9eec2}small{color:#b5c7dc}</style></head><body><header><h1>⚡ AWS DynamoDB Employee Manager</h1><p>Real AWS backend · Flask + boto3 · Employees table</p></header><main><div class="panel"><h2>Connection</h2><div id="status">Checking AWS…</div><div id="identity" style="margin-top:8px;color:#a9eec2"></div><button onclick="createTable()">Create Employees table in AWS</button><button class="danger" onclick="deleteTable()">Delete AWS table</button><button class="secondary" onclick="refresh()">Refresh</button><p><small>Uses your server's AWS credentials and selected AWS Region. Never enter credentials in the browser.</small></p></div><div class="panel"><h2>Employee CRUD</h2><div class="fields"><input id="id" placeholder="Employee ID (E103)"><input id="name" placeholder="Name"><input id="dept" placeholder="Department"><input id="salary" type="number" min="0" step="any" placeholder="Salary"></div><button onclick="put()">PutItem</button><button class="secondary" onclick="get()">GetItem</button><button class="secondary" onclick="updateSalary()">Update salary</button><button class="danger" onclick="removeEmployee()">DeleteItem</button><p id="message"></p></div><div class="panel"><h2>Employees in AWS</h2><button onclick="refresh()">Scan table</button><div style="overflow-x:auto"><table><thead><tr><th>EmployeeID</th><th>Name</th><th>Department</th><th>Salary</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const $=id=>document.getElementById(id);
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
async function run(fn){try{await fn()}catch(e){$('message').textContent='Error: '+e.message}}
async function refresh(){return run(async()=>{let c=await api('/api/connection');$('identity').textContent=`AWS Account: ${c.account} | IAM Principal: ${c.arn}`;let s=await api('/api/status');$('status').textContent=`Region: ${s.region} | Table: ${s.table} | ${s.exists?s.status:'NOT CREATED'}`;if(!s.exists){$('rows').innerHTML='<tr><td colspan="4">Create the AWS table first.</td></tr>';return}let d=await api('/api/employees');$('rows').replaceChildren();for(const item of d.items){let tr=document.createElement('tr');for(const key of ['EmployeeID','Name','Department','Salary']){let td=document.createElement('td');td.textContent=item[key]??'';tr.append(td)}$('rows').append(tr)}if(!d.items.length)$('rows').innerHTML='<tr><td colspan="4">No records yet</td></tr>'})}
const id=()=>encodeURIComponent($('id').value.trim());
async function createTable(){return run(async()=>{$('message').textContent='Creating table…';let d=await api('/api/table',{method:'POST'});$('message').textContent=d.message;await refresh()})}
async function deleteTable(){if(!confirm('Permanently delete Employees table and ALL AWS records?'))return;return run(async()=>{let d=await api('/api/table',{method:'DELETE'});$('message').textContent=d.message;await refresh()})}
async function put(){return run(async()=>{if(!id())throw Error('Employee ID required');let d=await api('/api/employees/'+id(),{method:'PUT',body:JSON.stringify({Name:$('name').value,Department:$('dept').value,Salary:$('salary').value})});$('message').textContent='Saved and verified with a strongly consistent AWS read: '+JSON.stringify(d.item);await refresh()})}
async function get(){return run(async()=>{if(!id())throw Error('Employee ID required');let d=await api('/api/employees/'+id());$('message').textContent=JSON.stringify(d.item,null,2);$('name').value=d.item.Name;$('dept').value=d.item.Department;$('salary').value=d.item.Salary})}
async function updateSalary(){return run(async()=>{if(!id())throw Error('Employee ID required');let d=await api('/api/employees/'+id()+'/salary',{method:'PATCH',body:JSON.stringify({Salary:$('salary').value})});$('message').textContent='Updated and verified in AWS: '+JSON.stringify(d.item);await refresh()})}
async function removeEmployee(){return run(async()=>{if(!id())throw Error('Employee ID required');let d=await api('/api/employees/'+id(),{method:'DELETE'});$('message').textContent=d.message;await refresh()})}
refresh();</script></body></html>
